version: '3.8'

services:
  api:
    build: .
    command: python api.py
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PORT=8000

  frontend:
    build: .
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - api
